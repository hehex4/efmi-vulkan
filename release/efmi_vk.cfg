# EFMI Vulkan: read by efmi_vk_inject.dll from its own folder.
# This folder sits in the EFMI folder of the XXMI Launcher (EFMI\EFMI-Vulkan), next to EFMI\Mods.
# A relative path is taken from this folder; the Core is the Mods folder's sibling Core\EFMI.
m2_mods = ../Mods
m2_enabled = 1
# Buffers unmapped by the game are not copied (the setting the game was played with).
unmap_snapshot_limit = 0
# The DX11 reading of a 2D texture at a 3D slot as measured on an NVIDIA GeForce RTX 5060 Laptop GPU
# (vendor 0x10DE, device 0x2D19); other devices are not affected.
m2_dimension_zero = 4318:11545
