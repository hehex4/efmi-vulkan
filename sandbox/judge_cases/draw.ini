; The original as the judge (D-150): CustomShader draws with their own blend and rasterizer states into a
; target cleared to (0.2, 0.4, 0.6, 1), read back by a compute shader (draw.read.hlsl). draw.vs.hlsl covers
; the lower left half, draw.ps.hlsl writes (x, 1, 0, 0.6) with x the IniParams x.
namespace = judge
[Constants]
global persist $saved = 0
global persist $blend_r = -1
global persist $blend_g = -1
global persist $blend_b = -1
global persist $blend_a = -1
global persist $outside_r = -1
global persist $outside_a = -1
global persist $culled_r = -1
global persist $culled_g = -1
global persist $front_r = -1
global persist $front_a = -1
global persist $masked_r = -1
global persist $masked_g = -1
global persist $masked_a = -1
global persist $factor_r = -1
global persist $factor_g = -1
global persist $factor_a = -1
global persist $plain_r = -1
global persist $plain_a = -1
[ResourceTarget]
type = Texture2D
width = 4
height = 4
format = R8G8B8A8_UNORM
array = 1
msaa = 1
[ResourceOut]
type = RWBuffer
format = R32_FLOAT
array = 8

[CustomShaderBlend]
vs = draw.vs.hlsl
ps = draw.ps.hlsl
blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = triangle_list
o0 = set_viewport ResourceTarget
draw = 3, 0
o0 = null
; the default rasterizer state culls back faces, clockwise being the front
[CustomShaderCulled]
vs = draw.vs.hlsl
ps = draw.ps.hlsl
topology = triangle_list
o0 = set_viewport ResourceTarget
draw = 3, 0
o0 = null
[CustomShaderFront]
vs = draw.vs.hlsl
ps = draw.ps.hlsl
front = CounterClockwise
topology = triangle_list
o0 = set_viewport ResourceTarget
draw = 3, 0
o0 = null
; a write mask alone switches blending on with the defaults (ONE, ZERO): red only
[CustomShaderMasked]
vs = draw.vs.hlsl
ps = draw.ps.hlsl
mask = 1
cull = none
topology = triangle_list
o0 = set_viewport ResourceTarget
draw = 3, 0
o0 = null
[CustomShaderFactor]
vs = draw.vs.hlsl
ps = draw.ps.hlsl
blend = ADD BLEND_FACTOR ZERO
alpha = ADD ZERO ONE
blend_factor[0] = 0.4
blend_factor[1] = 0.2
blend_factor[2] = 1
blend_factor[3] = 1
cull = none
topology = triangle_list
o0 = set_viewport ResourceTarget
draw = 3, 0
o0 = null
; no blend key: the state in place when it runs, here the program's default (no blending)
[CustomShaderPlain]
vs = draw.vs.hlsl
ps = draw.ps.hlsl
cull = none
topology = triangle_list
o0 = set_viewport ResourceTarget
draw = 3, 0
o0 = null
[CustomShaderRead]
cs = draw.read.hlsl
cs-t0 = ResourceTarget
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null

[Present]
x = 1
y = 0
clear = ResourceTarget 0.2 0.4 0.6 1
run = CustomShaderBlend
run = CustomShaderRead
store = $blend_r, ResourceOut, 0
store = $blend_g, ResourceOut, 1
store = $blend_b, ResourceOut, 2
store = $blend_a, ResourceOut, 3
store = $outside_r, ResourceOut, 4
store = $outside_a, ResourceOut, 7
; the winding turned round: culled as a back face, then drawn with the counterclockwise front
y = 1
clear = ResourceTarget 0.2 0.4 0.6 1
run = CustomShaderCulled
run = CustomShaderRead
store = $culled_r, ResourceOut, 0
store = $culled_g, ResourceOut, 1
run = CustomShaderFront
run = CustomShaderRead
store = $front_r, ResourceOut, 0
store = $front_a, ResourceOut, 3
y = 0
x = 0.4
clear = ResourceTarget 0.2 0.4 0.6 1
run = CustomShaderMasked
run = CustomShaderRead
store = $masked_r, ResourceOut, 0
store = $masked_g, ResourceOut, 1
store = $masked_a, ResourceOut, 3
x = 1
clear = ResourceTarget 0.2 0.4 0.6 1
run = CustomShaderFactor
run = CustomShaderRead
store = $factor_r, ResourceOut, 0
store = $factor_g, ResourceOut, 1
store = $factor_a, ResourceOut, 3
x = 0.4
clear = ResourceTarget 0.2 0.4 0.6 1
run = CustomShaderPlain
run = CustomShaderRead
store = $plain_r, ResourceOut, 0
store = $plain_a, ResourceOut, 3
$saved = 1
