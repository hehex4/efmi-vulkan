; The original as the judge (D-150): conditions, command lists, IniParams read by a shader, ring pools of
; variables and of resources, and a slot range binding pool elements.
namespace = judge
[Constants]
global persist $saved = 0
global persist $steps = 0
global persist $branch = -1
global persist $nested = -1
global persist $listed = -1
global persist $param_x = -1
global persist $param_y = -1
global persist $param_z = -1
global persist $param_w = -1
global persist $param_next = -1
global persist $ring_first = -1
global persist $ring_last = -1
global persist $ring_wrapped = -1
global persist $ring_sum = -1
global persist $slot_first = -1
global persist $slot_second = -1
global persist $slot_size = -1
global persist $unbound = -1
global persist $pool_image = -1
global persist $pool_structured = -1
global persist $pool_structured_first = -1
global $calls = 0

[PoolValues]
pool_size = 3
pool_variable_default_value = 5

[PoolBuffers]
pool_size = 2
type = Buffer
format = R32_FLOAT

[PoolImages]
pool_size = 1

[PoolStructured]
pool_size = 1

[ResourceImage]
type = Texture2D
width = 4
height = 4
format = R8G8B8A8_UNORM
array = 1
msaa = 1
[ResourceStructured]
type = StructuredBuffer
stride = 4
array = 3
data = 31 32 33
[ResourceA]
type = Buffer
format = R32_FLOAT
data = 11 12
[ResourceB]
type = Buffer
format = R32_FLOAT
data = 21 22 23
[ResourceOut]
type = RWBuffer
format = R32_FLOAT
array = 12

[CommandListCount]
$calls = $calls + 1
if $calls > 2
    $listed = $calls * 10
endif

[CustomShaderRead]
cs = flow.hlsl
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null

[Present]
if $steps < 4
    $steps = $steps + 1
endif
if $steps == 1
    $branch = 1
elif $steps == 4
    $branch = 4
    if $steps > 3 && !($steps > 5)
        $nested = 2
    else
        $nested = 3
    endif
else
    $branch = 9
endif
$calls = 0
run = CommandListCount
run = CommandListCount
run = CommandListCount
x = 0.25
y = $steps
z = -3
w = 7 / 2
x1 = 6
cs-t0 = null
cs-t1 = null
run = CustomShaderRead
store = $param_x, ResourceOut, 0
store = $param_y, ResourceOut, 1
store = $param_z, ResourceOut, 2
store = $param_w, ResourceOut, 3
store = $param_next, ResourceOut, 4
store = $unbound, ResourceOut, 5
$PoolValues[0] = 1
$PoolValues[-1] = 3
$ring_first = $PoolValues[0]
$ring_last = $PoolValues[2]
$ring_wrapped = $PoolValues[4]
$ring_sum = $PoolValues[0] + $PoolValues[1] + $PoolValues[2]
PoolBuffers[0] = ref ResourceA
PoolBuffers[1] = ref ResourceB
cs-t[0:1] = ref PoolBuffers[0:1]
run = CustomShaderRead
store = $slot_first, ResourceOut, 5
store = $slot_second, ResourceOut, 6
store = $slot_size, ResourceOut, 7
PoolImages[0] = ref ResourceImage
PoolStructured[0] = ref ResourceStructured
cs-t[2:2] = ref PoolImages[0:0]
cs-t[3:3] = ref PoolStructured[0:0]
run = CustomShaderRead
store = $pool_image, ResourceOut, 8
store = $pool_structured, ResourceOut, 9
store = $pool_structured_first, ResourceOut, 10
cs-t2 = null
cs-t3 = null
cs-t0 = null
cs-t1 = null
$saved = 1
