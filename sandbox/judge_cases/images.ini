; The original as the judge (D-150): image files, copies and clears, each read by a compute shader
; (images.read.hlsl: the texel at (1, 2) and the dimensions). The files are written by the judge
; (check_dx11_judge.py): 4x4 RGBA8, texel (x, y) = (60x + 10, 70y + 5, 255 - 30x - 20y, 100 + 10x + 30y).
namespace = judge
[Constants]
global persist $saved = 0
global persist $dds_r = -1
global persist $dds_g = -1
global persist $dds_b = -1
global persist $dds_a = -1
global persist $dds_w = -1
global persist $png_r = -1
global persist $png_g = -1
global persist $png_b = -1
global persist $png_a = -1
global persist $png_h = -1
global persist $rgb_r = -1
global persist $rgb_a = -1
global persist $srgb_png_r = -1
global persist $srgb_png_a = -1
global persist $srgb_dds_g = -1
global persist $srgb_dds_a = -1
global persist $copy_r = -1
global persist $copy_b = -1
global persist $clear_r = -1
global persist $clear_g = -1
global persist $clear_b = -1
global persist $clear_a = -1
global persist $rt_r = -1
global persist $rt_g = -1
global persist $rt_b = -1
global persist $rt_a = -1
global persist $uav_r = -1
global persist $uav_a = -1
global persist $missing_r = -1
global persist $missing_w = -1
[ResourceDds]
filename = images.dds
[ResourcePng]
filename = images.png
[ResourceRgb]
filename = images.rgb.png
[ResourceSrgbPng]
filename = images.png
color_space = sRGB
[ResourceSrgbDds]
filename = images.dds
color_space = sRGB
[ResourceMissing]
filename = images.missing.png
[ResourceCopy]
[ResourceTarget]
type = Texture2D
width = 4
height = 4
format = R8G8B8A8_UNORM
array = 1
msaa = 1
[ResourceRenderTarget]
type = Texture2D
width = 4
height = 4
format = R8G8B8A8_UNORM
array = 1
msaa = 1
bind_flags = shader_resource render_target
[ResourceUnordered]
type = Texture2D
width = 4
height = 4
format = R8G8B8A8_UNORM
array = 1
msaa = 1
bind_flags = shader_resource unordered_access
[ResourceOut]
type = RWBuffer
format = R32_FLOAT
array = 8

[CustomShaderDds]
cs = images.read.hlsl
cs-t0 = ResourceDds
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderPng]
cs = images.read.hlsl
cs-t0 = ResourcePng
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderRgb]
cs = images.read.hlsl
cs-t0 = ResourceRgb
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderSrgbPng]
cs = images.read.hlsl
cs-t0 = ResourceSrgbPng
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderSrgbDds]
cs = images.read.hlsl
cs-t0 = ResourceSrgbDds
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderCopy]
cs = images.read.hlsl
cs-t0 = ResourceCopy
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderTarget]
cs = images.read.hlsl
cs-t0 = ResourceTarget
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderRenderTarget]
cs = images.read.hlsl
cs-t0 = ResourceRenderTarget
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderUnordered]
cs = images.read.hlsl
cs-t0 = ResourceUnordered
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null
[CustomShaderMissing]
cs = images.read.hlsl
cs-t0 = ResourceMissing
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
cs-t0 = null

[Present]
run = CustomShaderDds
store = $dds_r, ResourceOut, 0
store = $dds_g, ResourceOut, 1
store = $dds_b, ResourceOut, 2
store = $dds_a, ResourceOut, 3
store = $dds_w, ResourceOut, 4
run = CustomShaderPng
store = $png_r, ResourceOut, 0
store = $png_g, ResourceOut, 1
store = $png_b, ResourceOut, 2
store = $png_a, ResourceOut, 3
store = $png_h, ResourceOut, 5
run = CustomShaderRgb
store = $rgb_r, ResourceOut, 0
store = $rgb_a, ResourceOut, 3
run = CustomShaderSrgbPng
store = $srgb_png_r, ResourceOut, 0
store = $srgb_png_a, ResourceOut, 3
run = CustomShaderSrgbDds
store = $srgb_dds_g, ResourceOut, 1
store = $srgb_dds_a, ResourceOut, 3
ResourceCopy = copy ResourceDds
run = CustomShaderCopy
store = $copy_r, ResourceOut, 0
store = $copy_b, ResourceOut, 2
; a texture only bound as t0 has no view a clear goes through: it stays zero
clear = ResourceTarget 0.2 0.4 0.6 1
run = CustomShaderTarget
store = $clear_r, ResourceOut, 0
store = $clear_g, ResourceOut, 1
store = $clear_b, ResourceOut, 2
store = $clear_a, ResourceOut, 3
clear = ResourceRenderTarget 0.2 0.4 0.6 1
run = CustomShaderRenderTarget
store = $rt_r, ResourceOut, 0
store = $rt_g, ResourceOut, 1
store = $rt_b, ResourceOut, 2
store = $rt_a, ResourceOut, 3
clear = ResourceUnordered 0.8 0.4 0.6 0.2
run = CustomShaderUnordered
store = $uav_r, ResourceOut, 0
store = $uav_a, ResourceOut, 3
; a file that does not load is a null resource: an unbound t0 reads zero and has no size
run = CustomShaderMissing
store = $missing_r, ResourceOut, 0
store = $missing_w, ResourceOut, 4
$saved = 1
