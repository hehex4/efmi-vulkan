; The original as the judge (D-150): buffer copies, references, regions and store, in Present.
namespace = judge
[Constants]
global persist $copied = -1
global persist $direct = -1
global persist $past = -1
global persist $referenced = -1
global persist $region = -1
global persist $size = -1
[ResourceSource]
type = Buffer
format = R32_FLOAT
data = 1.5 2.5 3.5 4.5
[ResourceCopy]
[ResourceAlias]
[ResourceRegion]
[Present]
ResourceCopy = copy ResourceSource
store = $copied, ResourceCopy, 2
store = $direct, ResourceSource, 1
store = $past, ResourceSource, 9
ResourceAlias = ref ResourceSource
store = $referenced, ResourceAlias, 3
ResourceRegion = copy ResourceSource->Region(4, 8)
store = $region, ResourceRegion, 1
$size = ResourceSource->size
