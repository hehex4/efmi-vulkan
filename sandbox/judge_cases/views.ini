; The original as the judge (D-150): buffer views as the slots take them: a typed buffer, a structured
; one bound directly, a raw one, and a reference with its own format (views.hlsl reads them).
namespace = judge
[Constants]
global persist $saved = 0
global persist $typed = -1
global persist $typed_count = -1
global persist $structured = -1
global persist $structured_count = -1
global persist $raw = -1
global persist $raw_bytes = -1
global persist $reformat_x = -1
global persist $reformat_y = -1
global persist $reformat_count = -1
global persist $offset_first = -1
global persist $offset_count = -1
[ResourceTyped]
type = Buffer
format = R32_FLOAT
data = 1.5 2.5 3.5 4.5
[ResourceStructured]
type = StructuredBuffer
stride = 4
array = 3
data = 31 32 33
[ResourceRaw]
type = ByteAddressBuffer
data = 41 42 43 44
[ResourceReformat]
format = R32G32B32A32_FLOAT
[ResourceOut]
type = RWBuffer
format = R32_FLOAT
array = 12
[CustomShaderRead]
cs = views.hlsl
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null

[Present]
cs-t0 = ResourceTyped
cs-t1 = ResourceStructured
cs-t2 = ResourceRaw
ResourceReformat = ref ResourceTyped
cs-t3 = ResourceReformat
run = CustomShaderRead
store = $typed, ResourceOut, 0
store = $typed_count, ResourceOut, 1
store = $structured, ResourceOut, 2
store = $structured_count, ResourceOut, 3
store = $raw, ResourceOut, 4
store = $raw_bytes, ResourceOut, 5
store = $reformat_x, ResourceOut, 6
store = $reformat_y, ResourceOut, 7
store = $reformat_count, ResourceOut, 8
; a region of the typed buffer: its view starts at the region's offset
cs-t0 = ref ResourceTyped->Region(8, 16)
run = CustomShaderRead
store = $offset_first, ResourceOut, 0
store = $offset_count, ResourceOut, 1
cs-t0 = null
cs-t1 = null
cs-t2 = null
cs-t3 = null
$saved = 1
