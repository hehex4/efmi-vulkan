; The original as the judge (D-150): a CustomShader dispatch writing a RWBuffer, read back by store.
namespace = judge
[Constants]
global persist $first = -1
global persist $third = -1
global persist $cleared = -1
; store alone does not mark the settings to be saved: an assignment does
global persist $saved = 0
[ResourceOut]
type = RWBuffer
format = R32_FLOAT
array = 4
[ResourceCleared]
type = RWBuffer
format = R32_FLOAT
array = 4
[CustomShaderFill]
cs = compute.hlsl
cs-u0 = ResourceOut
dispatch = 1, 1, 1
cs-u0 = null
[Present]
run = CustomShaderFill
store = $first, ResourceOut, 0
store = $third, ResourceOut, 2
clear = ResourceCleared 6.25
store = $cleared, ResourceCleared, 3
$saved = 1
