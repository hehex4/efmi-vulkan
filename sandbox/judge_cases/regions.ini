; The original as the judge (D-150): a copy of a buffer region lands at the start of the copy, which keeps
; the source's size. (A region past the buffer is undefined in D3D11: the original's device stops answering
; on the test machine, so it is no case here; D-153.)
namespace = judge
[Constants]
global persist $saved = 0
global persist $inside = -1
global persist $inside_size = -1
global persist $inside_one = -1
global persist $after = -1
[ResourceSource]
type = Buffer
format = R32_FLOAT
data = 1.5 2.5 3.5 4.5
[ResourceInside]
[Present]
ResourceInside = copy ResourceSource->Region(4, 8)
store = $inside, ResourceInside, 0
$inside_size = ResourceInside->size
store = $inside_one, ResourceInside, 1
$after = 1
$saved = 1
