; The original as the judge (D-150): what the original's resource queries give in Present.
namespace = judge
[Constants]
global persist $width = -1
global persist $height = -1
global persist $mips = -1
global persist $array = -1
global persist $bb_width = -1
global persist $stride = -1
global persist $empty = -1
global persist $made_width = -1
global persist $made_mips = -1
[ResourceTexture]
type = Texture2D
width = 64
height = 32
mips = 3
format = R8G8B8A8_UNORM
[ResourceMade]
type = Texture2D
width = 64
height = 32
mips = 3
array = 1
format = R8G8B8A8_UNORM
[ResourceStructured]
type = StructuredBuffer
stride = 12
array = 5
[ResourceEmpty]
[Present]
ps-t0 = ResourceTexture
$width = ps-t0->width
$height = ps-t0->height
$mips = ps-t0->mips
$array = ps-t0->array
$bb_width = bb->width
vs-t1 = ResourceStructured
$stride = vs-t1->stride
ps-t2 = ResourceEmpty
$empty = ps-t2 === null
ps-t3 = ResourceMade
$made_width = ps-t3->width
$made_mips = ps-t3->mips
ps-t3 = null
ps-t0 = null
vs-t1 = null
