; The original as the judge (D-150): how the parser reads a file. Beside this case the check writes
; encoding.bom.ini (a UTF-8 byte order mark, CRLF line ends) and encoding.invalid.ini (a byte sequence
; that is not UTF-8 on a comment line, as a file saved in a legacy code page has); what the original
; makes of the lines after them is what the layer makes of them. Each file declares a namespace of its
; own and sets a persistent variable in its [Present].
namespace = judge
[Constants]
global persist $own = 0
[Present]
$own = 1
