; The original as the judge (D-150): expressions, written to persistent variables.
namespace = judge
[Constants]
global $frames = 0
global persist $a = 0
global persist $b = 0
global persist $c = 0
[Present]
$frames = $frames + 1
$a = 7 * 3 - 1
$b = $a / 8 + ($frames > 2)
$c = ($a // 3) % 4 - -2 ** 3
